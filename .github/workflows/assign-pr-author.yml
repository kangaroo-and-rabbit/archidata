---
name: "Assign PR Author as Assignee"

on:
  pull_request:
    types:
      - opened

# Least privilege: setting the assignee of a pull request is the only write needed
permissions:
  contents: read
  pull-requests: write

jobs:
  assign-pr-author-as-assignee:
    # The token of a pull request opened from a fork is read-only, it can not set the assignee
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Plain gh command instead of a third-party action holding a write token
      - name: "Assign Author as Assignee"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh pr edit "$PR_NUMBER" --add-assignee "$PR_AUTHOR"
