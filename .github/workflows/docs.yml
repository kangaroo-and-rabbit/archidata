name: Documentation

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Least privilege: the build job only reads, the deploy job adds what Pages needs
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install Zensical
        run: pip install zensical==0.0.70
      - name: Build the documentation site
        run: zensical build --clean --strict
      - name: Rewrite links that leave the doc folder to GitHub URLs
        run: |
          find site -name '*.html' -print0 | xargs -0 sed -i -E \
            's#href="(\.\./)+(sample|src)/#href="https://github.com/kangaroo-and-rabbit/archidata/blob/develop/\2/#g'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Generate the Javadoc and llms-full.txt
        # llms-full.txt is built by the embed-llm-documentation execution of the pom,
        # the same file as the one shipped in the jar.
        run: mvn -B generate-resources javadoc:javadoc -Dformatter.skip=true -Dcheckstyle.skip=true
      - name: Publish llms.txt and llms-full.txt at the root of the site
        run: cp llms.txt target/classes/META-INF/archidata/llms-full.txt site/
      - name: Copy the Javadoc into the site under /api/
        run: |
          APIDOCS=$(find target -type d -name apidocs | head -n 1)
          test -n "$APIDOCS"
          mkdir -p site/api
          cp -r "$APIDOCS"/. site/api/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
