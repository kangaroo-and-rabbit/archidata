# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches:
      - develop
  pull_request:

# Least privilege: every job reads the code only, a job that needs more declares it itself
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Start MongoDB with Replica Set
        run: |
          # Create keyfile directory
          mkdir -p $HOME/mongodb/keys
          # Generate keyfile
          openssl rand -base64 756 > $HOME/mongodb/keys/keyfile
          chmod 400 $HOME/mongodb/keys/keyfile
          # Start MongoDB container with replica set and keyfile
          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=root \
            -e MONGO_INITDB_ROOT_PASSWORD=base_db_password \
            -v $HOME/mongodb/keys:/data/keys \
            mongo:latest \
            bash -c "chown 999:999 /data/keys/keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/keys/keyfile"
          # Wait for MongoDB to be ready
          sleep 10
          # Initialize replica set
          docker exec mongodb mongosh "mongodb://root:base_db_password@localhost:27017/admin" --eval '
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27017" }]
            })
          '
          # Wait for replica set to be ready
          sleep 5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: validate
        run: mvn validate
      - name: compile
        run: mvn compile
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml
      - name: spot-bug
        run: mvn spotbugs:check
      - name: Test 
        run: DB_HOST="127.0.0.1" mvn test
      - name: find the element
        run: find . -name "dependency-graph.json"
      - name: Install the library locally for the sample
        run: mvn -B install -DskipTests -Dgpg.skip=true
      - name: Build and test the sample
        run: mvn -B -f sample/archidata/basic/pom.xml verify -Darchidata.version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)

  # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive.
  # Own job because it needs a write token (contents: write), the build job keeps the read-only one.
  # Only on the develop branch itself: the token of a pull request opened from a fork is read-only.
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

  # Informational scan of the dependencies of the pom against the OSV database (never blocks the CI:
  # a CVE without published fix must not stop the development)
  osv-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan the dependencies with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pom.xml
