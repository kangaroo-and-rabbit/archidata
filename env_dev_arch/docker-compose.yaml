---
services:
  mongodb:
    build: ./mongodb
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: base_db_password
    ports:
      - 27017:27017
    volumes:
      - ./data/mongo/keys/:/data/keys/
    tmpfs:
      - /data/db:size=2G # MongoDB data in RAM (adjust size as needed)
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    healthcheck:
      test: >-
        mongosh --username root --password base_db_password
        --authenticationDatabase admin --quiet --eval "rs.status().ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongoexpress:
    image: mongo-express:latest
    container_name: mongoexpress
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: base_db_password
      ME_CONFIG_MONGODB_URL: mongodb://root:base_db_password@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "4077:8081"
    depends_on:
      mongodb:
        condition: service_healthy

  # Example wiring of the field-encryption keys into an application container using Docker secrets.
  # archidata reads a secret either inline (<NAME>) or, following the Docker convention, from the
  # file pointed to by <NAME>_FILE. See doc/field_encryption.md.
  #
  # myapp:
  #   image: my-archidata-app:latest
  #   environment:
  #     DATA_DECRYPT_ENABLE: "true"               # authorize decryption on read
  #     DATA_ENCRYPT_KEY_FILE: /run/secrets/data_encrypt_key   # base key ("default")
  #     DATA_ENCRYPT_KEYS_DIR: /run/secrets/encrypt_keys       # optional: directory of named keys
  #   secrets:
  #     - data_encrypt_key
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy

# secrets:
#   data_encrypt_key:
#     file: ./secrets/data_encrypt_key   # generated via EncryptionKeyGenerator (never commit real keys)
